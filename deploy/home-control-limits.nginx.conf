# HTTP context; keys are empty outside this application's selected routes.
map $uri $casa_login_key {
    default "";
    /casa/auth/login $binary_remote_addr;
}
map $uri $casa_api_key {
    default "";
    ~^/casa/api/ $binary_remote_addr;
}
limit_req_zone $casa_login_key zone=casa_login:1m rate=6r/m;
limit_req_zone $casa_api_key zone=casa_api:1m rate=10r/s;
