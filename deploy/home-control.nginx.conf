# Public HTTPS frontend. Data and commands require HA authentication in the backend.
# Requires /etc/nginx/conf.d/home-control-limits.conf in the HTTP context.
location = /casa {
    return 302 /casa/;
}
location ^~ /casa/ {
    limit_req zone=casa_login burst=6 nodelay;
    limit_req zone=casa_api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 5s;
    # Callback query strings can contain one-use OAuth codes: do not persist them.
    access_log off;
    error_log /dev/null crit;
}
