name: Android APK

# Every push to main that touches android/ builds a signed APK and publishes it as a
# GitHub Release "android-v1.0.<run>" of this repository (owner decision 2026-11-25:
# like the trading app, no Firebase). The app's updater checks the latest release on
# start and every 6 h, notifies, verifies the signature and asks Android to install.
# The web app on the Pi is NOT affected.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (optional)'
        required: false

permissions:
  contents: write   # create the release; nothing else

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-published release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # versionCode must grow with every APK, or Android refuses the update.
      VERSION_CODE: ${{ github.run_number }}
      TAG: android-v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon -PversionCode=$VERSION_CODE

      - name: Signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret missing (see android/README.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > casa-release.jks
          {
            echo "storeFile=casa-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon -PversionCode=$VERSION_CODE -PupdateRepo=${{ github.repository }}

      - name: Stage APK
        id: apk
        run: |
          OUT="app/build/outputs/apk/release/casa-salavat-1.0.$VERSION_CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # Published with the preinstalled gh CLI (no third-party action). Notes: the input, or
      # the Android commits since the previous release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -z "$NOTES" ]; then
            PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              NOTES=$(git log --pretty='- %s' "$PREV"..HEAD -- . | head -n 30)
            fi
            NOTES="${NOTES:-$(git log -1 --pretty='- %s')}"
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" --target "$GITHUB_SHA" \
            --title "Casa Salavat 1.0.$VERSION_CODE" --notes "$NOTES" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: casa-salavat-1.0.${{ github.run_number }}
          path: android/${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Clean up secrets
        if: always()
        run: rm -f casa-release.jks keystore.properties
