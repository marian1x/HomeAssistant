configure:
  name: Configure energy policy
  description: Admin only. Validated parameters and optimistic revision are required.
  fields:
    values:
      required: true
      selector:
        object:
    revision:
      required: true
      selector:
        number:
          min: 0
          max: 999999
          mode: box
resume_device:
  name: Resume automatic control
  fields:
    device:
      required: true
      selector:
        select:
          options:
            - tcl
            - whirlpool
            - boiler
            - tesla
set_ev_limit:
  name: Set owner charge limit
  description: 20-100 %. Below 50 % the policy stops home charging at the target.
  fields:
    soc:
      required: true
      selector:
        number:
          min: 20
          max: 100
          unit_of_measurement: "%"
set_charge_price:
  name: Set charge price
  description: Owner price per kWh for one logged charge (stations); empty clears it.
  fields:
    id:
      required: true
      selector:
        number:
          min: 1
          max: 100000000
          mode: box
    price_kwh:
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: RON/kWh
    note:
      selector:
        text:
fleet_telemetry:
  name: Fleet Telemetry
  description: Admin only. status (local), remote (config/errors from Tesla), push (signed config), stop (remove config).
  fields:
    action:
      required: true
      selector:
        select:
          options:
            - status
            - remote
            - push
            - stop
    token:
      selector:
        text:
    exp:
      selector:
        number:
          min: 0
          max: 4102444800
          mode: box
