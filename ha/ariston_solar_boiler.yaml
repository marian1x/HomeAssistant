input_boolean:
  ariston_solar_boost_enabled:
    name: Ariston solar boost enabled
    icon: mdi:water-boiler-auto

  ariston_solar_boost_active:
    name: Ariston solar boost active
    icon: mdi:water-boiler
    initial: false

  ariston_summer_temperature_mode_enabled:
    name: Ariston summer default temperature mode
    icon: mdi:white-balance-sunny
    initial: true

input_text:
  ariston_boiler_entity_id:
    name: Ariston boiler entity id
    icon: mdi:water-boiler
    initial: water_heater.boiler
    max: 80

  ariston_boiler_boost_switch_entity_id:
    name: Ariston boost switch entity id
    icon: mdi:rocket-launch
    initial: switch.ariston_boost
    max: 80

  ariston_boiler_power_switch_entity_id:
    name: Ariston power switch entity id
    icon: mdi:power
    initial: switch.boiler_ariston_power
    max: 80

  ariston_boiler_boost_mode:
    name: Ariston boost operation mode
    icon: mdi:tune-variant
    initial: BOOST
    max: 32

input_number:
  ariston_boiler_power_kw:
    name: Ariston boiler power
    icon: mdi:water-boiler
    min: 0.5
    max: 4
    step: 0.1
    unit_of_measurement: kW
    mode: box
    initial: 1.8

  ariston_grid_cost_lei_kwh:
    name: Ariston grid cost
    icon: mdi:cash
    min: 0
    max: 5
    step: 0.01
    unit_of_measurement: lei/kWh
    mode: box
    initial: 1.1

  ariston_solar_cost_lei_kwh:
    name: Ariston solar opportunity cost
    icon: mdi:cash
    min: 0
    max: 5
    step: 0.01
    unit_of_measurement: lei/kWh
    mode: box
    initial: 0.45

  ariston_solar_production_threshold_kw:
    name: Ariston solar production threshold
    icon: mdi:solar-power-variant
    min: 0
    max: 8
    step: 0.1
    unit_of_measurement: kW
    mode: box
    initial: 2.0

  ariston_required_surplus_kw:
    name: Ariston required surplus
    icon: mdi:transmission-tower-export
    min: 0
    max: 8
    step: 0.1
    unit_of_measurement: kW
    mode: box
    initial: 1.8

  ariston_stop_surplus_kw:
    name: Ariston stop surplus
    icon: mdi:transmission-tower-import
    min: 0
    max: 3
    step: 0.1
    unit_of_measurement: kW
    mode: box
    initial: 0.3

  ariston_max_import_kw:
    name: Ariston max import while boosting
    icon: mdi:transmission-tower-import
    min: 0
    max: 3
    step: 0.1
    unit_of_measurement: kW
    mode: box
    initial: 0.3

  ariston_summer_warm_day_temperature:
    name: Ariston summer warm day temperature
    icon: mdi:thermometer-low
    min: 40
    max: 80
    step: 1
    unit_of_measurement: "\u00B0C"
    mode: box
    initial: 40

  ariston_summer_cool_day_temperature:
    name: Ariston summer cool day temperature
    icon: mdi:thermometer
    min: 40
    max: 80
    step: 1
    unit_of_measurement: "\u00B0C"
    mode: box
    initial: 45

  ariston_summer_cool_day_threshold:
    name: Ariston summer cool day threshold
    icon: mdi:weather-cloudy
    min: 0
    max: 30
    step: 0.5
    unit_of_measurement: "\u00B0C"
    mode: box
    initial: 15

  ariston_normal_temperature:
    name: Ariston normal temperature
    icon: mdi:thermometer
    min: 40
    max: 80
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial: 40

  ariston_max_temperature_fallback:
    name: Ariston max temperature fallback
    icon: mdi:thermometer-high
    min: 50
    max: 90
    step: 1
    unit_of_measurement: "°C"
    mode: box
    initial: 80

template:
  - sensor:
      - name: Ariston surplus disponibil boiler
        unique_id: ariston_surplus_disponibil_boiler_kw
        icon: mdi:transmission-tower-export
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.injectie_in_retea')) }}"
        state: >
          {{ [0, states('sensor.injectie_in_retea') | float(0)] | max | round(3) }}

      - name: Ariston boiler current temperature
        unique_id: ariston_boiler_current_temperature
        icon: mdi:thermometer-water
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ boiler.startswith('water_heater.') and states(boiler) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        state: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ state_attr(boiler, 'current_temperature') | float(0) | round(1) }}

      - name: Ariston boiler target temperature
        unique_id: ariston_boiler_target_temperature
        icon: mdi:thermometer-check
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ boiler.startswith('water_heater.') and states(boiler) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        state: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ state_attr(boiler, 'temperature') | float(0) | round(1) }}

      - name: Ariston boiler max temperature
        unique_id: ariston_boiler_max_temperature
        icon: mdi:thermometer-high
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ boiler.startswith('water_heater.') and states(boiler) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        state: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {{ state_attr(boiler, 'max_temp') | float(states('input_number.ariston_max_temperature_fallback') | float(80)) | round(1) }}

      - name: Ariston boiler power estimated
        unique_id: ariston_boiler_power_estimated_kw
        icon: mdi:water-boiler
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('binary_sensor.ariston_boiler_consuming_estimated') in ['on', 'off'] }}
        state: >
          {% if is_state('binary_sensor.ariston_boiler_consuming_estimated', 'on') %}
            {{ states('input_number.ariston_boiler_power_kw') | float(1.8) }}
          {% else %}
            0
          {% endif %}

      - name: Ariston boiler grid power estimated
        unique_id: ariston_boiler_grid_power_estimated_kw
        icon: mdi:transmission-tower-import
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {% set power = states('sensor.ariston_boiler_power_estimated') | float(0) %}
          {% set import = states('sensor.consum_din_retea') | float(0) %}
          {% if power > 0 %}
            {{ [power, import] | min | round(3) }}
          {% else %}
            0
          {% endif %}

      - name: Ariston boiler solar power estimated
        unique_id: ariston_boiler_solar_power_estimated_kw
        icon: mdi:solar-power-variant
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: >
          {% set power = states('sensor.ariston_boiler_power_estimated') | float(0) %}
          {% set grid = states('sensor.ariston_boiler_grid_power_estimated') | float(0) %}
          {{ [0, power - grid] | max | round(3) }}

      - name: Ariston boiler cost today
        unique_id: ariston_boiler_cost_today_lei
        icon: mdi:cash-multiple
        unit_of_measurement: lei
        state_class: total
        state: >
          {% set solar = states('sensor.ariston_boiler_solar_energy_daily') | float(0) %}
          {% set grid = states('sensor.ariston_boiler_grid_energy_daily') | float(0) %}
          {% set solar_cost = states('input_number.ariston_solar_cost_lei_kwh') | float(0.45) %}
          {% set grid_cost = states('input_number.ariston_grid_cost_lei_kwh') | float(1.1) %}
          {{ ((solar * solar_cost) + (grid * grid_cost)) | round(2) }}

      - name: Ariston outside temperature
        unique_id: ariston_outside_temperature
        icon: mdi:thermometer-outline
        unit_of_measurement: "\u00B0C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ state_attr('weather.forecast_home', 'temperature') is not none }}
        state: >
          {{ state_attr('weather.forecast_home', 'temperature') | float(0) | round(1) }}

      - name: Ariston summer target temperature
        unique_id: ariston_summer_target_temperature
        icon: mdi:thermometer-auto
        unit_of_measurement: "\u00B0C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set outside = states('sensor.ariston_outside_temperature') | float(99) %}
          {% set threshold = states('input_number.ariston_summer_cool_day_threshold') | float(15) %}
          {% set warm = states('input_number.ariston_summer_warm_day_temperature') | float(40) %}
          {% set cool = states('input_number.ariston_summer_cool_day_temperature') | float(45) %}
          {% if is_state('sun.sun', 'above_horizon') and outside < threshold %}
            {{ cool | round(0) }}
          {% else %}
            {{ warm | round(0) }}
          {% endif %}

  - binary_sensor:
      - name: Ariston boiler consuming estimated
        unique_id: ariston_boiler_consuming_estimated
        icon: mdi:water-boiler
        availability: >
          {% set power_switch = states('input_text.ariston_boiler_power_switch_entity_id') %}
          {{ is_state(power_switch, 'off')
             or states('binary_sensor.boiler_ariston_is_heating') in ['on', 'off'] }}
        state: >
          {% set power_switch = states('input_text.ariston_boiler_power_switch_entity_id') %}
          {{ not is_state(power_switch, 'off')
             and is_state('binary_sensor.boiler_ariston_is_heating', 'on') }}

      - name: Ariston boiler can solar boost
        unique_id: ariston_boiler_can_solar_boost
        icon: mdi:water-boiler-auto
        state: >
          {% set boiler = states('input_text.ariston_boiler_entity_id') %}
          {% set boiler_ok = boiler.startswith('water_heater.') and states(boiler) not in ['unknown', 'unavailable', 'none', 'None', ''] %}
          {% set current = state_attr(boiler, 'current_temperature') | float(0) %}
          {% set max_temp = state_attr(boiler, 'max_temp') | float(states('input_number.ariston_max_temperature_fallback') | float(80)) %}
          {% set production = states('sensor.productie_solara_curenta') | float(0) %}
          {% set surplus = states('sensor.ariston_surplus_disponibil_boiler') | float(0) %}
          {{ is_state('input_boolean.ariston_solar_boost_enabled', 'on')
             and is_state('binary_sensor.deye_baterie_permite_consumatori_flexibili', 'on')
             and boiler_ok
             and not is_state('switch.salavat_t3_charger', 'on')
             and production >= (states('input_number.ariston_solar_production_threshold_kw') | float(2))
             and surplus >= (states('input_number.ariston_required_surplus_kw') | float(1.8))
             and current < (max_temp - 1) }}

sensor:
  - platform: integration
    source: sensor.ariston_boiler_power_estimated
    name: Ariston boiler energy total
    unique_id: ariston_boiler_energy_total
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
    round: 3

  - platform: integration
    source: sensor.ariston_boiler_solar_power_estimated
    name: Ariston boiler solar energy total
    unique_id: ariston_boiler_solar_energy_total
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
    round: 3

  - platform: integration
    source: sensor.ariston_boiler_grid_power_estimated
    name: Ariston boiler grid energy total
    unique_id: ariston_boiler_grid_energy_total
    unit_time: h
    method: left
    max_sub_interval:
      minutes: 1
    round: 3

utility_meter:
  ariston_boiler_energy_daily:
    source: sensor.ariston_boiler_energy_total
    cycle: daily
  ariston_boiler_energy_monthly:
    source: sensor.ariston_boiler_energy_total
    cycle: monthly
  ariston_boiler_energy_yearly:
    source: sensor.ariston_boiler_energy_total
    cycle: yearly

  ariston_boiler_solar_energy_daily:
    source: sensor.ariston_boiler_solar_energy_total
    cycle: daily
  ariston_boiler_solar_energy_monthly:
    source: sensor.ariston_boiler_solar_energy_total
    cycle: monthly
  ariston_boiler_solar_energy_yearly:
    source: sensor.ariston_boiler_solar_energy_total
    cycle: yearly

  ariston_boiler_grid_energy_daily:
    source: sensor.ariston_boiler_grid_energy_total
    cycle: daily
  ariston_boiler_grid_energy_monthly:
    source: sensor.ariston_boiler_grid_energy_total
    cycle: monthly
  ariston_boiler_grid_energy_yearly:
    source: sensor.ariston_boiler_grid_energy_total
    cycle: yearly

automation:
  - id: ariston_solar_boiler_discover_entities
    alias: Ariston solar boiler discover entities
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    action:
      - variables:
          ariston_water_heaters: "{{ integration_entities('ariston') | select('match', '^water_heater\\.') | list }}"
          ariston_boost_switches: "{{ integration_entities('ariston') | select('match', '^switch\\.') | select('search', 'boost') | list }}"
          ariston_power_switches: "{{ integration_entities('ariston') | select('match', '^switch\\.') | select('search', 'power') | list }}"
      - if:
          - condition: template
            value_template: "{{ ariston_water_heaters | count > 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.ariston_boiler_entity_id
            data:
              value: "{{ ariston_water_heaters[0] }}"
      - if:
          - condition: template
            value_template: "{{ ariston_boost_switches | count > 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.ariston_boiler_boost_switch_entity_id
            data:
              value: "{{ ariston_boost_switches[0] }}"
      - if:
          - condition: template
            value_template: "{{ ariston_power_switches | count > 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.ariston_boiler_power_switch_entity_id
            data:
              value: "{{ ariston_power_switches[0] }}"

  - id: ariston_solar_boiler_boost_from_surplus
    alias: Ariston solar boiler boost from surplus
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.ariston_boiler_can_solar_boost
        to: "on"
        for: "00:02:00"
    action:
      - variables:
          boiler_entity: "{{ states('input_text.ariston_boiler_entity_id') }}"
          boost_switch: "{{ states('input_text.ariston_boiler_boost_switch_entity_id') }}"
          power_switch: "{{ states('input_text.ariston_boiler_power_switch_entity_id') }}"
          boost_mode_config: "{{ states('input_text.ariston_boiler_boost_mode') }}"
          max_temp: >
            {% set fallback = states('input_number.ariston_max_temperature_fallback') | float(80) %}
            {{ state_attr(states('input_text.ariston_boiler_entity_id'), 'max_temp') | float(fallback) }}
          operation_list: "{{ state_attr(states('input_text.ariston_boiler_entity_id'), 'operation_list') or [] }}"
          boost_mode: >
            {% set wanted = states('input_text.ariston_boiler_boost_mode') | lower %}
            {% set ns = namespace(mode='') %}
            {% for mode in operation_list %}
              {% if mode | lower == wanted %}
                {% set ns.mode = mode %}
              {% endif %}
            {% endfor %}
            {{ ns.mode }}
      - if:
          - condition: template
            value_template: >
              {{ power_switch.startswith('switch.')
                 and states(power_switch) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: switch.turn_on
            target:
              entity_id: "{{ power_switch }}"
      - if:
          - condition: template
            value_template: >
              {{ boost_switch.startswith('switch.')
                 and states(boost_switch) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: switch.turn_on
            target:
              entity_id: "{{ boost_switch }}"
      - if:
          - condition: template
            value_template: "{{ boost_mode | length > 0 }}"
        then:
          - service: water_heater.set_operation_mode
            target:
              entity_id: "{{ boiler_entity }}"
            data:
              operation_mode: "{{ boost_mode }}"
      - service: water_heater.set_temperature
        target:
          entity_id: "{{ boiler_entity }}"
        data:
          temperature: "{{ max_temp }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.ariston_solar_boost_active
      - service: logbook.log
        data:
          name: Ariston solar boost
          message: >
            Boiler set to {{ max_temp }} degC using {{ states('sensor.ariston_surplus_disponibil_boiler') }} kW solar surplus.
          entity_id: "{{ boiler_entity }}"

  - id: ariston_solar_boiler_stop_when_surplus_drops
    alias: Ariston solar boiler stop when surplus drops
    mode: restart
    trigger:
      - platform: template
        value_template: >
          {{ is_state('input_boolean.ariston_solar_boost_active', 'on')
             and (
               (states('sensor.ariston_surplus_disponibil_boiler') | float(0)) < (states('input_number.ariston_stop_surplus_kw') | float(0.3))
               or (states('sensor.consum_din_retea') | float(0)) > (states('input_number.ariston_max_import_kw') | float(0.3))
             ) }}
        for: "00:04:00"
    condition:
      - condition: state
        entity_id: input_boolean.ariston_solar_boost_enabled
        state: "on"
    action:
      - variables:
          boiler_entity: "{{ states('input_text.ariston_boiler_entity_id') }}"
          boost_switch: "{{ states('input_text.ariston_boiler_boost_switch_entity_id') }}"
          power_switch: "{{ states('input_text.ariston_boiler_power_switch_entity_id') }}"
          normal_temp: "{{ states('input_number.ariston_normal_temperature') | float(55) }}"
      - if:
          - condition: template
            value_template: >
              {{ boost_switch.startswith('switch.')
                 and states(boost_switch) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: switch.turn_off
            target:
              entity_id: "{{ boost_switch }}"
      - if:
          - condition: template
            value_template: >
              {{ boiler_entity.startswith('water_heater.')
                 and states(boiler_entity) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: water_heater.set_temperature
            target:
              entity_id: "{{ boiler_entity }}"
            data:
              temperature: "{{ normal_temp }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.ariston_solar_boost_active
      - service: logbook.log
        data:
          name: Ariston solar boost
          message: >
            Solar surplus dropped or grid import started. Boiler returned to {{ normal_temp }} degC.
          entity_id: "{{ boiler_entity }}"

  - id: ariston_solar_boiler_restore_after_tesla
    alias: Ariston solar boiler restore after Tesla
    mode: restart
    trigger:
      - platform: state
        entity_id: switch.salavat_t3_charger
        to: "off"
        for: "00:05:00"
      - platform: state
        entity_id: input_boolean.tesla_solar_charging_enabled
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.ariston_solar_boost_enabled
        state: "on"
    action:
      - variables:
          boiler_entity: "{{ states('input_text.ariston_boiler_entity_id') }}"
          power_switch: "{{ states('input_text.ariston_boiler_power_switch_entity_id') }}"
          normal_temp: "{{ states('input_number.ariston_normal_temperature') | float(55) }}"
      - if:
          - condition: template
            value_template: >
              {{ power_switch.startswith('switch.')
                 and states(power_switch) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: switch.turn_on
            target:
              entity_id: "{{ power_switch }}"
      - if:
          - condition: template
            value_template: >
              {{ boiler_entity.startswith('water_heater.')
                 and states(boiler_entity) not in ['unknown', 'unavailable', 'none', 'None', ''] }}
        then:
          - service: water_heater.set_temperature
            target:
              entity_id: "{{ boiler_entity }}"
            data:
              temperature: "{{ normal_temp }}"

  - id: ariston_summer_default_temperature_manager
    alias: Ariston summer default temperature manager
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: weather.forecast_home
      - platform: state
        entity_id: sun.sun
      - platform: state
        entity_id:
          - input_boolean.ariston_solar_boost_enabled
          - input_boolean.ariston_summer_temperature_mode_enabled
          - input_number.ariston_summer_warm_day_temperature
          - input_number.ariston_summer_cool_day_temperature
          - input_number.ariston_summer_cool_day_threshold
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: state
        entity_id: input_boolean.ariston_solar_boost_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.ariston_summer_temperature_mode_enabled
        state: "on"
      - condition: template
        value_template: "{{ now().month in [5, 6, 7, 8, 9] }}"
    action:
      - variables:
          target_temp: "{{ states('sensor.ariston_summer_target_temperature') | float(40) }}"
          boiler_entity: "{{ states('input_text.ariston_boiler_entity_id') }}"
      - if:
          - condition: template
            value_template: >
              {{ (states('input_number.ariston_normal_temperature') | float(0)) != target_temp }}
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.ariston_normal_temperature
            data:
              value: "{{ target_temp }}"
      - if:
          - condition: template
            value_template: >
              {{ is_state('input_boolean.ariston_solar_boost_active', 'off')
                 and boiler_entity.startswith('water_heater.')
                 and states(boiler_entity) not in ['unknown', 'unavailable', 'none', 'None', '']
                 and (state_attr(boiler_entity, 'temperature') | float(-1)) != target_temp }}
        then:
          - service: water_heater.set_temperature
            target:
              entity_id: "{{ boiler_entity }}"
            data:
              temperature: "{{ target_temp }}"
          - service: logbook.log
            data:
              name: Ariston summer mode
              entity_id: "{{ boiler_entity }}"
              message: >
                Boiler default set to {{ target_temp | round(0) }}?C based on outside temperature
                {{ states('sensor.ariston_outside_temperature') }}?C and daylight state {{ states('sun.sun') }}.

  - id: ariston_stop_internal_state_when_disabled
    alias: Ariston stop internal state when automation disabled
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.ariston_solar_boost_enabled
        to: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.ariston_solar_boost_active
      - service: logbook.log
        data:
          name: Ariston automation
          message: Automatizarea Ariston este oprita. Temperatura setata manual nu va fi modificata de Home Assistant.
