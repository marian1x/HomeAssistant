# Broker between fleet-telemetry (internal network) and Home Assistant (LAN, TLS).
# Installed as /etc/fleet-telemetry/mosquitto/mosquitto.conf. No anonymous access.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Location data is not kept on disk: no persistence. fleet-telemetry publishes non-retained;
# only the ops status message is retained (memory only, lost on restart).
persistence false
max_packet_size 65536
max_queued_messages 2000
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# fleet-telemetry, only reachable on the internal ft-bus network.
listener 1883 172.30.41.3
protocol mqtt

# Home Assistant over the LAN (published on 192.168.50.101:8883, filtered to .107).
listener 8883 172.30.42.2
protocol mqtt
cafile /mosquitto/config/tls/ca.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
tls_version tlsv1.2
