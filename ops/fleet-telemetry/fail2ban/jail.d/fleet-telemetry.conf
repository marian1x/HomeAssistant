[fleet-telemetry]
enabled = true
backend = systemd
filter = fleet-telemetry
# Banned in DOCKER-USER: the published port is forwarded traffic, not INPUT.
banaction = iptables-multiport[chain="DOCKER-USER", port="4443", protocol="tcp"]
port = 4443
maxretry = 3
findtime = 10m
bantime = 1d
bantime.increment = true
bantime.maxtime = 30d
# LAN (includes the router for hairpin connections when the car is home on WiFi).
ignoreip = 127.0.0.1/8 ::1 192.168.50.0/24
