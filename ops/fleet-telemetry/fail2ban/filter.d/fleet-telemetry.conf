# Clients that reach 4443 without a valid Tesla vehicle certificate (scanners, probes).
# Plain network errors (EOF, reset, timeout) are NOT counted: a car on a weak mobile link
# can produce those and must never be banned.
[Definition]
failregex = ^.*http: TLS handshake error from <HOST>:\d+: (?:tls: client didn't provide a certificate|tls: first record does not look like a TLS handshake|tls: unsupported SSLv2 handshake received|tls: client offered only unsupported versions|tls: no cipher suite supported by both client and server|tls: failed to verify certificate|tls: bad certificate|tls: unknown certificate|tls: no application protocol|client sent an HTTP request to an HTTPS server|tls: received unexpected handshake message|tls: client requested unsupported application protocols|remote error: tls:)
ignoreregex =
journalmatch = SYSLOG_IDENTIFIER=fleet-telemetry
